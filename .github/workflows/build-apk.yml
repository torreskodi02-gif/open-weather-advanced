name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create full Flutter Android project
        run: |
          flutter create --project-name open_weather --org com.openweather --platforms android temp
          # Keep our custom code
          rm -rf temp/lib
          cp -r lib temp/
          cp pubspec.yaml temp/
          cp -r .github temp/ 2>/dev/null || true
          # Move everything up
          shopt -s dotglob
          rm -rf android ios web linux macos windows
          mv temp/* temp/.* . 2>/dev/null || true
          rmdir temp 2>/dev/null || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: open-weather-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
